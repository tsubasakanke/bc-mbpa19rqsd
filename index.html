<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BODYCAM BREACH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <!-- タイトル -->
  <div id="menu" class="panel hidden">
    <h1>BODYCAM BREACH</h1>
    <p class="tag">ボディカム視点のステルス制圧FPS。協力・チーム戦・個人戦。</p>
    <label>名前 <input id="name" maxlength="12"></label>
    <div id="loadoutMenu"></div>
    <h3>ソロ任務</h3>
    <div id="soloMissions" class="row"></div>
    <h3>オンライン</h3>
    <button id="create" class="btn primary">部屋を作る</button>
    <div class="row">
      <input id="joinCode" placeholder="部屋コード" maxlength="8">
      <button id="join" class="btn">参加する</button>
    </div>
    <p id="menuStat" class="stat"></p>
    <p class="keys">WASD 移動 / Shift ダッシュ / C しゃがみ / 右クリック/T 構え / R リロード / N ナイトビジョン / G 扉・爆弾・ラペリング / H 起爆 / Tab スコア / F1 ボディカム加工 切替</p>
  </div>

  <!-- ロビー -->
  <div id="lobby" class="panel hidden">
    <h2>部屋 <span id="lcode"></span></h2>
    <div class="row">
      <input id="invite" readonly>
      <button id="copy" class="btn small">招待URLをコピー</button>
    </div>
    <div id="players"></div>
    <h3>装備(ミッションで使える武器だけ選ばれる)</h3>
    <div id="loadoutLobby"></div>
    <h3>モード</h3>
    <div id="modes" class="row"></div>
    <p id="modeDesc" class="desc"></p>
    <h3>舞台</h3>
    <div id="missions" class="row"></div>
    <button id="start" class="btn primary">スタート</button>
    <p id="lobbyStat" class="stat"></p>
    <button id="leave" class="btn small">部屋を出る</button>
  </div>

  <div id="loading"><div class="bar"><div id="fill"></div></div><div id="ltext">読み込み中…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="bodycam.js"></script>
  <script>
    var buildUrl = "Build";
    var config = {
      arguments: [],
      devicePixelRatio: 1,   // 高解像度ディスプレイでも画面ピクセル数を増やさない(重さ対策)
      dataUrl: buildUrl + "/web.data",
      frameworkUrl: buildUrl + "/web.framework.js",
      codeUrl: buildUrl + "/web.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "BODYCAM BREACH",
      productVersion: "1.0"
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/web.loader.js";
    script.onload = function () {
      createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) { EchoUI.progress(p); })
        .then(function (inst) { EchoUI.ready(inst); })
        .catch(function (e) { EchoUI.fail(e); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
